<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Application Logs</title>
  <style>html { display: none; }</style>
  <script>if (self === top) { document.documentElement.style.display = "block"; } else { top.location = self.location; }</script>
</head>
<body>
  <main>
    <h1>Application Logs</h1>
    <p>Page {{ .Page }} of {{ .TotalPages }} ({{ .TotalLines }} lines total)</p>

    {{ if .HasPrev }}
      <a href="/logs?page={{ .PrevPage }}&limit={{ .Limit }}">Previous</a>
    {{ end }}
    {{ if .HasNext }}
      <a href="/logs?page={{ .NextPage }}&limit={{ .Limit }}">Next</a>
    {{ end }}

    <pre>{{ range .Lines }}{{ . }}
{{ end }}</pre>
  </main>
</body>
</html>
